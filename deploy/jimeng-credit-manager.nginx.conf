# Management stays on the LAN. Only port 18418 is forwarded by the router.
server {
    listen 18419;
    server_name example.test;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    client_max_body_size 512k;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18420;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 25s;
    }
}

server {
    listen 18418 default_server;
    server_name _;
    client_max_body_size 512k;
    access_log off;
    location ~ ^/api/(health|ingest|collector/status|collector/commands|collector/diagnostics|collector/extension\.zip|collector/commands/[A-Za-z0-9_-]+/result)$ {
        proxy_pass http://127.0.0.1:18420;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_http_version 1.1;
        proxy_read_timeout 25s;
    }
    location / { return 404; }
}
